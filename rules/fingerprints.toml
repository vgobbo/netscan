vendor = "Daikin"
model = "Daikin HVAC Unit ({daikin.protocol|Wi-Fi} Wi-Fi Adapter)"
notes = "Smart HVAC / air conditioning unit (fw {daikin.ver|unknown}, SSID {daikin.ssid|N/A})"

[[rule]]

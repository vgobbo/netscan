model = "Daikin Smart HVAC / Wi-Fi Adapter"
notes = "Smart HVAC / air conditioning unit"

# ==============================================================================
# 4. Ubiquiti / UniFi Network Gear & Surveillance
# ==============================================================================

[[rule]]
id = "unifi_os_manifest"
description = "UniFi Gateway / Controller identified via UNIFI_OS_MANIFEST"
priority = 100
conclusive = true
requires_scanners = ["http"]

[rule.match]
http_body_contains = ["UNIFI_OS_MANIFEST"]

[[rule.extract]]
source = "http_body"
pattern = 'window\.UNIFI_OS_MANIFEST\s*=\s*\{[^}]*"shortName"\s*:\s*"([^"]+)"'
target = "unifi.model"

[rule.output]
device_type = "Router"
device_name = "UniFi {unifi.model|Gateway / Controller}"
vendor = "Ubiquiti"
model = "Ubiquiti {unifi.model|UniFi Routing Hardware}"
notes = "Security gateway and network controller"

[[rule]]
id = "unifi_protect_doorbell"
description = "Ubiquiti UniFi Protect Doorbell"
priority = 100
conclusive = true
requires_scanners = ["arp_oui_rdns"]

[rule.match]
vendor_contains = ["ubiquiti"]
hostname_contains = ["doorbell"]

[rule.output]
device_type = "Surveillance"
device_name = "UniFi Protect Doorbell"
model = "Ubiquiti UniFi Protect Doorbell"
notes = "Smart video doorbell and intercom"

[[rule]]
id = "unifi_protect_chime_host"
description = "Ubiquiti UniFi Protect Smart Chime by hostname"
priority = 98
conclusive = true
requires_scanners = ["arp_oui_rdns"]

[rule.match]
vendor_contains = ["ubiquiti"]
hostname_contains = ["chime", "up-chime", "espressif"]

[rule.output]
device_type = "Surveillance"
device_name = "UniFi Protect Smart Chime"
model = "Ubiquiti UP-Chime"
notes = "Wireless smart indoor chime"

[[rule]]
id = "unifi_protect_chime_ports"
description = "Ubiquiti UniFi Protect Smart Chime by port profile"
priority = 90
conclusive = true
requires_scanners = ["ports_fast"]

[rule.match]
vendor_contains = ["ubiquiti"]
is_gateway = false
ports_all = [8080]
ports_none = [443]

[rule.output]
device_type = "Surveillance"
device_name = "UniFi Protect Smart Chime"
model = "Ubiquiti UP-Chime"
notes = "Wireless smart indoor chime"

[[rule]]
id = "unifi_gateway_router"
description = "Ubiquiti UniFi Gateway / Controller"
priority = 70
conclusive = true
requires_scanners = ["arp_oui_rdns"]

[rule.match]
vendor_contains = ["ubiquiti"]
is_gateway = true

[rule.output]
device_type = "Router"
device_name = "UniFi Gateway / Controller"
model = "Ubiquiti UniFi Routing Hardware"
notes = "Primary security gateway, router, and controller"

[[rule]]
id = "unifi_controller_https"
description = "Ubiquiti UniFi Controller on HTTPS ports"
priority = 65
conclusive = true
requires_scanners = ["ports_fast"]

[rule.match]
vendor_contains = ["ubiquiti"]
ports_any = [443, 8443]

[rule.output]
device_type = "Router"
device_name = "UniFi Gateway / Controller"
model = "Ubiquiti UniFi Routing Hardware"
notes = "Primary security gateway, router, and controller"


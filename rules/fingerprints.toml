[rule.output]
device_type = "Climate"
device_name = "Daikin Air Conditioner"
vendor = "Daikin"
model = "Daikin Smart HVAC / Wi-Fi Adapter"
notes = "Smart HVAC / air conditioning unit"

[[rule]]

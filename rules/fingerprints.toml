[[rule]]
id = "ssh_workstation"
description = "Generic Linux/Unix workstation with active SSH service"
priority = 50
conclusive = true
requires_scanners = ["ports_fast"]

[rule.match]
ports_all = [22]
hostname_not_empty = true

[rule.output]
device_type = "Workstation"
device_name = "Workstation ({hostname})"
notes = "Linux / Unix workstation with active SSH service"

# ==============================================================================
# 13. Non-Conclusive Best-Guess Fallbacks (never short-circuit early)
# ==============================================================================

[[rule]]
id = "gateway_fallback"
description = "Generic default gateway / router fallback"
priority = 30
conclusive = false

[rule.match]
is_gateway = true

[rule.output]
device_type = "Router"
device_name = "{vendor|Network} Gateway / Router"
notes = "Default gateway routing traffic for the subnet"

[[rule]]
id = "http_title_fallback"
description = "Fallback using short HTTP page title"
priority = 25
conclusive = false

[rule.match]
http_title = { regex = "^.{1,39}$" }

[rule.output]
device_type = "Unknown"
device_name = "{http.title}"

[[rule]]
id = "hostname_fallback"
description = "Fallback using resolved local hostname"
priority = 15
conclusive = false

[rule.match]
hostname_not_empty = true

[rule.output]
device_type = "Unknown"
device_name = "{hostname}"

[[rule]]
id = "vendor_fallback"
description = "Fallback using MAC OUI vendor name"
priority = 10
conclusive = false

[rule.match]
vendor = { regex = ".+" }

[rule.output]
device_type = "Unknown"
device_name = "{vendor} Device"

# Declarative device fingerprinting ruleset for netscan.
# Rules are evaluated from highest to lowest priority after each scanner stage.
# A host becomes conclusive when a single `conclusive = true` rule matches at the
# highest matched priority tier and no higher-priority conclusive rule remains
# eligible in a later scanner stage.

[meta]
schema_version = 1

# Additional OUI vendor prefixes merged with built-in OUI database
[[oui]]
prefix = "24CD8D"
vendor = "Murata Manufacturing"

[[oui]]
prefix = "FC84A7"
vendor = "Murata Manufacturing"

# ==============================================================================
# 1. Google Cast Devices (Chromecast, Google TV, Nest Audio, Google Home)
# ==============================================================================

[[rule]]
id = "google_cast_tv"
description = "Google TV / Chromecast streaming device via Cast eureka_info"
priority = 100
conclusive = true
requires_scanners = ["api_protocols"]

[rule.match]
attributes = { "cast.name" = { regex = "(tv|streamer)" } }

[rule.output]
device_type = "Entertainment"
device_name = "{cast.name}"
model = "Google TV / Chromecast Streaming Device"
notes = "Media streaming device with Cast protocol"

[[rule]]
id = "google_cast_speaker"
description = "Google Nest / Home smart speaker via Cast eureka_info"
priority = 100
conclusive = true
requires_scanners = ["api_protocols"]

[rule.match]
attributes = { "cast.name" = { regex = "(speaker|audio)" } }

[rule.output]
device_type = "Entertainment"
device_name = "{cast.name}"
model = "Google Nest / Home Smart Speaker"
notes = "Voice assistant and multiroom audio speaker"

[[rule]]
id = "google_cast_nest_host"
description = "Google Nest Cast device matched by Cast name and Nest hostname"
priority = 98
conclusive = true
requires_scanners = ["api_protocols"]

[rule.match]
attributes_present = ["cast.name"]
hostname_contains = ["nest"]

[rule.output]
device_type = "Entertainment"
device_name = "{cast.name}"
model = "Google Nest / Home Smart Speaker"
notes = "Voice assistant and multiroom audio speaker"

[[rule]]
id = "google_cast_generic"
description = "Generic Google Cast multimedia receiver"
priority = 95
conclusive = true
requires_scanners = ["api_protocols"]

[rule.match]
attributes_present = ["cast.name"]

[rule.output]
device_type = "Entertainment"
device_name = "{cast.name}"
model = "Google Cast Device"
notes = "Cast-enabled multimedia receiver"

[[rule]]
id = "google_nest_hostname_fallback"
description = "Google Nest speaker identified via hostname when Cast port is unreachable"
priority = 70
conclusive = true
requires_scanners = ["arp_oui_rdns"]

[rule.match]
vendor_contains = ["google"]
hostname_contains = ["nest"]

[rule.output]
device_type = "Entertainment"
device_name = "Google Nest Speaker"
model = "Google Nest / Home Smart Speaker"
notes = "Voice assistant and multiroom audio speaker"

